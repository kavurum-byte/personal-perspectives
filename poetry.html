<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Poetry | Mani's Perspectives</title><link rel="stylesheet" href="styles.css"><style>main{max-width:960px;margin:3rem auto;padding:0 1.5rem}.poems{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem}.poems article{border:1px solid #ddd;border-radius:12px;padding:1rem}input{padding:.8rem;max-width:450px;width:100%;margin:1rem 0}</style></head><body><header class="site-header"><div class="topbar"><a class="brand" href="index.html">Mani’s Perspectives</a><nav class="nav"><a class="nav-link" href="index.html">Home</a><a class="nav-link" href="poetry.html">Poetry</a></nav></div></header><main><h1>Poetry</h1><p>Poems by Mani S. Kavuru</p><p>This preliminary index contains 25 verified titles from a 31-poem collection. Full texts and the remaining titles are not yet imported. <a href="https://www.poetry.com/user/339145/manik.86465">Read the original poems on Poetry.com</a>.</p><label for="q">Search poem titles</label><div><input id="q" type="search" placeholder="Search titles…"></div><p id="count"></p><section class="poems" id="poems"></section></main><script>const titles=["Amma's Jouurney","Birthday Wish of Gratitude to Mom","Chandrayan-3","Chaos in the Nearest We Sow","City of Brotherly Love","Daily Swim and Locker Room","Daughter’s Delight","Doctor's Words","Endless Love is Endless Fear","Farewell","Immigrant","Joy of Flying","Loss of Face","Mundane Birthday Wish","Ode to a Musical Genre","Ode to a Throne Cheek-to-Cheek","What I Failed to Say","The Pour House Ditty","The Bell at My Own Casa Tranquila","Your Voice In My Head","Resolutions be Damned","Poem 22","The Garden","The Dude Abides","The Other Kind of Strength"];function draw(){let q=document.querySelector('#q').value.toLowerCase(),a=titles.filter(x=>x.toLowerCase().includes(q)).sort((a,b)=>a.localeCompare(b));document.querySelector('#count').textContent=a.length+' titles';document.querySelector('#poems').replaceChildren(...a.map(x=>{let el=document.createElement('article');el.textContent=x;return el}))}document.querySelector('#q').addEventListener('input',draw);draw()</script></body></html>

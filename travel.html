<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Travels & Experiences | Perspectives & Reflections</title>
<style>
:root{--ink:#203044;--muted:#657384;--line:#dfe4e7;--accent:#245d79}
*{box-sizing:border-box}body{margin:0;background:#f9faf9;color:var(--ink);font:16px/1.65 system-ui,-apple-system,Segoe UI,sans-serif}
header{background:#152d43;color:#fff;padding:32px max(24px,calc((100vw - 1050px)/2)) 25px}
header a{color:#d8e5ed}header h1{font:normal clamp(30px,5vw,46px)/1.2 Georgia,serif;margin:10px 0}
header p{color:#c9d7e1;margin:0}main{max-width:1050px;margin:auto;padding:32px 22px 80px}
.intro{max-width:800px;color:#526173}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:20px;margin:26px 0}
.tile{border:1px solid var(--line);background:white;border-radius:9px;overflow:hidden;cursor:pointer;text-align:left;padding:0;color:inherit;font:inherit}
.tile:hover{box-shadow:0 5px 22px #142b411b}.tile img{width:100%;height:200px;object-fit:cover;display:block}
.tile .body{padding:18px}.tile h2{font:normal 24px/1.25 Georgia,serif;margin:6px 0}.tile small,.meta{color:var(--muted)}
.article{background:white;border:1px solid var(--line);border-radius:9px;padding:clamp(20px,4vw,40px);margin-top:24px}
.article h2{font:normal clamp(29px,4vw,42px)/1.2 Georgia,serif;margin:12px 0}
.caption{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:26px}
.gallery a img{width:100%;height:175px;object-fit:cover;border-radius:5px;display:block}
.back{background:#e9f0f2;border:0;border-radius:5px;padding:9px 14px;cursor:pointer;color:#245d79;font:600 14px system-ui}
footer{text-align:center;border-top:1px solid var(--line);padding:25px;color:var(--muted)}
</style></head><body>
<header><a href="index.html">← Perspectives & Reflections</a><h1>Travels & Experiences</h1><p>Places visited, photographs taken, and reflections along the way.</p></header>
<main><div id="content"><p>Loading travel stories…</p></div></main>
<footer>Personal travel journal · Original captions and photographs from the author's Facebook archive</footer>
<script>
const el=document.querySelector('#content');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=s=>new Date(s+'T12:00:00').toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
let trips=[];
function home(){history.replaceState(null,'',location.pathname);el.innerHTML='<p class="intro">A selection of illustrated travel journals recovered from original Facebook posts. Dates indicate when the stories were posted. Select a destination to read the original narrative and view its photographs.</p><div class="grid">'+trips.map((t,i)=>'<button class="tile" data-trip="'+i+'"><img loading="lazy" src="'+esc(t.photos[0])+'" alt="Photograph from '+esc(t.title)+'"><div class="body"><small>'+date(t.date)+' · '+t.photos.length+' photos</small><h2>'+esc(t.title)+'</h2><span>View story and gallery →</span></div></button>').join('')+'</div>';el.querySelectorAll('[data-trip]').forEach(b=>b.onclick=()=>openTrip(+b.dataset.trip));}
function openTrip(i){const t=trips[i];if(!t)return;history.replaceState(null,'','#trip-'+(i+1));el.innerHTML='<button class="back" id="back">← All travels</button><article class="article"><div class="meta">'+date(t.date)+' · '+t.photos.length+' photographs</div><h2>'+esc(t.title)+'</h2><div class="caption">'+esc(t.original_caption)+'</div><div class="gallery">'+t.photos.map((p,j)=>'<a href="'+esc(p)+'" target="_blank" rel="noopener"><img loading="lazy" src="'+esc(p)+'" alt="'+esc(t.title)+' photograph '+(j+1)+'"></a>').join('')+'</div></article>';document.querySelector('#back').onclick=home;window.scrollTo(0,0)}
fetch('travel.json').then(r=>{if(!r.ok)throw Error('Missing travel data');return r.json()}).then(d=>{trips=d;const m=location.hash.match(/^#trip-(\d+)$/);m?openTrip(+m[1]-1):home()}).catch(()=>{el.textContent='Travel stories are temporarily unavailable.'});
</script></body></html>

name: Validate archive
on:
  push:
    paths:
      - 'posts.json'
      - 'archive-index.json'
      - 'additional/**'
      - 'batches/**'
      - 'scripts/validate-archive.py'
      - '.github/workflows/validate-archive.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate all archive entries
        run: python scripts/validate-archive.py
